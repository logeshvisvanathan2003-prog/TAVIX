services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: tavix, POSTGRES_PASSWORD: tavix, POSTGRES_DB: tavix }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tavix:tavix@db:5432/tavix
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
