services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: tavix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tavix
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tavix:${POSTGRES_PASSWORD}@db:5432/tavix
    depends_on: [db]
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
    depends_on: [backend]
volumes:
  pgdata:
  caddy_data:
